name: Build And Test

on: push

permissions:
  id-token: write
  contents: read

env:
  AWS_DEV_REGION: us-east-1
  AWS_DEV_ROLE_ARN: arn:aws:iam::297820887526:role/nabto-webrtc-sdk-cpp-github-actions-access
  VCPKG_BINARY_SOURCES: "clear;x-aws,s3://vcpkg-build-cache-us-east-1,readwrite"

jobs:
  build-and-test-cpp:
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ macos-15, ubuntu-24.04 ]
        include:
          - os: ubuntu-24.04
          - os: macos-15
    timeout-minutes: 30
    steps:
     - name: Checkout repository
       uses: actions/checkout@v4
       with:
         submodules: recursive
         fetch-depth: 0
     - uses: aws-actions/configure-aws-credentials@v6
       with:
         role-to-assume: ${{ env.AWS_DEV_ROLE_ARN }}
         aws-region: ${{ env.AWS_DEV_REGION }}
         role-duration-seconds: 7200
     - name: Build and unittest
       run: cmake --workflow --preset test
       working-directory: sdk

     - uses: oven-sh/setup-bun@v2

     - name: Install integration test server
       run: bun install
       working-directory: integration_test_server

     - name: Start integration test server
       run: bun dev &
       working-directory: integration_test_server

     - name: Integration test run
       run: ./build/test/nabto_integration_test
       working-directory: sdk
